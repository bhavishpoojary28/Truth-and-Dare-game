<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth & Dare with Friends</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One:wght@400&family=Poppins:wght@300;400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
            padding: 20px;
        }
        
        .screen {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        .screen.active {
            display: block;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .app-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-icon {
            margin-bottom: 10px;
            animation: bounce 2s ease-in-out infinite;
        }
        
        .logo-image {
            width: 120px;
            height: auto;
            max-width: 150px;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
            transition: transform 0.3s ease;
        }
        
        .logo-image:hover {
            transform: scale(1.05);
        }
        
        .logo-text {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #ffe66d);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 3s ease infinite;
        }
        
        .logo-subtitle {
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            color: #f0f0f0;
            font-weight: 300;
            opacity: 0.9;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }
        
        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #ffe66d);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 3s ease infinite;
        }
        
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #fff;
        }
        
        h3 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #f0f0f0;
        }
        
        .btn {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border: none;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 50px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-decoration: none;
            display: inline-block;
            min-width: 150px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-truth {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
        }
        
        .btn-dare {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
        }
        
        .btn-small {
            padding: 10px 20px;
            font-size: 0.9rem;
            min-width: 100px;
        }
        
        .question-card {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .question-text {
            font-size: 1.2rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        
        .player-input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
        
        .player-input::placeholder {
            color: #666;
        }
        
        .player-list {
            margin: 20px 0;
        }
        
        .player-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .current-player {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffe66d;
            margin-bottom: 15px;
        }
        
        .remove-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        
        .game-stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            font-size: 0.9rem;
        }
        
        .stat {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 10px;
            flex: 1;
            margin: 0 5px;
        }
        
        @media (max-width: 480px) {
            .container {
                width: 95%;
                padding: 10px;
            }
            
            .screen {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .btn {
                padding: 12px 25px;
                font-size: 1rem;
                margin: 8px;
                min-width: 130px;
            }
            
            .question-text {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Welcome Screen -->
        <div id="welcome-screen" class="screen active">
            <div class="app-logo">
                <div class="logo-icon">
                    <img src="logoo.png" alt="BP Poojary Logo" class="logo-image">
                </div>
                <div class="logo-text">Truth & Dare</div>
                <div class="logo-subtitle">with Friends</div>
            </div>
            <p style="font-size: 1.1rem; margin-bottom: 30px; opacity: 0.9;">
                Get ready for fun, laughter, and unforgettable moments!
            </p>
            <button class="btn" onclick="showGameMode()">🚀 Start Game</button>
            <div style="margin-top: 20px; font-size: 0.9rem; opacity: 0.7; color: #f0f0f0;">
                Created by <strong>Bhavish Poojary</strong>
            </div>
        </div>
        
        <!-- Game Mode Selection -->
        <div id="game-mode-screen" class="screen">
            <h2>Choose Game Mode</h2>
            <button class="btn" onclick="startSoloMode()">🎯 Solo Mode</button>
            <button class="btn" onclick="showPlayerSetup()">👥 Friends Mode</button>
            <button class="btn btn-small" onclick="showWelcome()">← Back</button>
        </div>
        
        <!-- Player Setup Screen -->
        <div id="player-setup-screen" class="screen">
            <h2>Add Players</h2>
            <input type="text" id="player-name-input" class="player-input" placeholder="Enter player name" maxlength="20">
            <button class="btn btn-small" onclick="addPlayer()">➕ Add Player</button>
            
            <div class="player-list" id="player-list">
                <!-- Players will be added here -->
            </div>
            
            <div style="margin-top: 30px;">
                <button class="btn" onclick="startFriendsMode()" id="start-friends-btn" disabled>🎮 Start Game</button>
                <button class="btn btn-small" onclick="showGameMode()">← Back</button>
            </div>
        </div>
        
        <!-- Solo Game Screen -->
        <div id="solo-game-screen" class="screen">
            <h2>Choose Your Challenge</h2>
            <button class="btn btn-truth" onclick="generateTruth(false)">💭 Truth</button>
            <button class="btn btn-dare" onclick="generateDare(false)">⚡ Dare</button>
            <button class="btn btn-small" onclick="showGameMode()">🏠 Home</button>
            
            <div class="game-stats">
                <div class="stat">
                    <div>Truths: <span id="solo-truth-count">0</span></div>
                </div>
                <div class="stat">
                    <div>Dares: <span id="solo-dare-count">0</span></div>
                </div>
            </div>
        </div>
        
        <!-- Friends Game Screen -->
        <div id="friends-game-screen" class="screen">
            <div class="current-player" id="current-player-display">
                <!-- Current player will be displayed here -->
            </div>
            
            <h3>Choose Your Challenge</h3>
            <button class="btn btn-truth" onclick="generateTruth(true)">💭 Truth</button>
            <button class="btn btn-dare" onclick="generateDare(true)">⚡ Dare</button>
            <button class="btn btn-small" onclick="showGameMode()">🏠 Home</button>
            
            <div class="game-stats">
                <div class="stat">
                    <div>Round: <span id="round-count">1</span></div>
                </div>
                <div class="stat">
                    <div>Players: <span id="player-count">0</span></div>
                </div>
            </div>
        </div>
        
        <!-- Question Display Screen -->
        <div id="question-screen" class="screen">
            <div id="question-header">
                <!-- Question type and player info will be shown here -->
            </div>
            
            <div class="question-card">
                <div class="question-text" id="question-text">
                    <!-- Question/dare will appear here -->
                </div>
            </div>
            
            <button class="btn" onclick="nextQuestion()">🔄 Next</button>
            <button class="btn btn-small" onclick="goBack()">← Back</button>
        </div>
    </div>

        // Screen management functions
        function showScreen(screenId) {
            // Hide all screens
            const screens = document.querySelectorAll('.screen');
            screens.forEach(screen => screen.classList.remove('active'));
            
            // Show target screen
            document.getElementById(screenId).classList.add('active');
        }
        
        function showWelcome() {
            gameState.previousScreen = 'welcome-screen';
            showScreen('welcome-screen');
        }
        
        function showGameMode() {
            gameState.previousScreen = 'game-mode-screen';
            showScreen('game-mode-screen');
        }
        
        function showPlayerSetup() {
            gameState.previousScreen = 'player-setup-screen';
            showScreen('player-setup-screen');
            document.getElementById('player-name-input').focus();
        }
        
        // Game mode functions
        function startSoloMode() {
            gameState.mode = 'solo';
            gameState.soloStats = { truths: 0, dares: 0 };
            gameState.previousScreen = 'solo-game-screen';
            updateSoloStats();
            showScreen('solo-game-screen');
        }
        
        function startFriendsMode() {
            if (gameState.players.length < 2) {
                alert('Please add at least 2 players!');
                return;
            }
            
            gameState.mode = 'friends';
            gameState.currentPlayerIndex = 0;
            gameState.round = 1;
            gameState.previousScreen = 'friends-game-screen';
            updateFriendsDisplay();
            showScreen('friends-game-screen');
        }
        
        // Player management functions
        function addPlayer() {
            const input = document.getElementById('player-name-input');
            const playerName = input.value.trim();
            
            if (playerName === '') {
                alert('Please enter a player name!');
                return;
            }
            
            if (gameState.players.includes(playerName)) {
                alert('This player name already exists!');
                return;
            }
            
            if (gameState.players.length >= 10) {
                alert('Maximum 10 players allowed!');
                return;
            }
            
            gameState.players.push(playerName);
            input.value = '';
            updatePlayerList();
            input.focus();
        }
        
        function removePlayer(index) {
            gameState.players.splice(index, 1);
            updatePlayerList();
        }
        
        function updatePlayerList() {
            const playerList = document.getElementById('player-list');
            const startBtn = document.getElementById('start-friends-btn');
            
            playerList.innerHTML = '';
            
            gameState.players.forEach((player, index) => {
                const playerItem = document.createElement('div');
                playerItem.className = 'player-item';
                playerItem.innerHTML = `
                    <span>${player}</span>
                    <button class="remove-btn" onclick="removePlayer(${index})">✖</button>
                `;
                playerList.appendChild(playerItem);
            });
            
            // Enable/disable start button
            startBtn.disabled = gameState.players.length < 2;
            startBtn.style.opacity = gameState.players.length < 2 ? '0.5' : '1';
        }
        
        // Question generation functions
        function generateTruth(isFriendsMode) {
            const randomTruth = truthQuestions[Math.floor(Math.random() * truthQuestions.length)];
            displayQuestion('Truth', randomTruth, isFriendsMode);
            
            if (isFriendsMode) {
                // Move to next player
                nextPlayer();
            } else {
                gameState.soloStats.truths++;
                updateSoloStats();
            }
        }
        
        function generateDare(isFriendsMode) {
            const randomDare = dareTasks[Math.floor(Math.random() * dareTasks.length)];
            displayQuestion('Dare', randomDare, isFriendsMode);
            
            if (isFriendsMode) {
                // Move to next player
                nextPlayer();
            } else {
                gameState.soloStats.dares++;
                updateSoloStats();
            }
        }
        
        function displayQuestion(type, question, isFriendsMode) {
            const header = document.getElementById('question-header');
            const questionText = document.getElementById('question-text');
            
            if (isFriendsMode) {
                const currentPlayer = gameState.players[gameState.currentPlayerIndex];
                header.innerHTML = `<h2>${type} for ${currentPlayer}</h2>`;
            } else {
                header.innerHTML = `<h2>${type}</h2>`;
            }
            
            questionText.textContent = question;
            showScreen('question-screen');
        }
        
        // Game flow functions
        function nextPlayer() {
            gameState.currentPlayerIndex = (gameState.currentPlayerIndex + 1) % gameState.players.length;
            if (gameState.currentPlayerIndex === 0) {
                gameState.round++;
            }
            updateFriendsDisplay();
        }
        
        function nextQuestion() {
            if (gameState.mode === 'friends') {
                showScreen('friends-game-screen');
            } else {
                showScreen('solo-game-screen');
            }
        }
        
        function goBack() {
            showScreen(gameState.previousScreen);
        }
        
        // UI update functions
        function updateSoloStats() {
            document.getElementById('solo-truth-count').textContent = gameState.soloStats.truths;
            document.getElementById('solo-dare-count').textContent = gameState.soloStats.dares;
        }
        
        function updateFriendsDisplay() {
            const currentPlayerDisplay = document.getElementById('current-player-display');
            const roundCount = document.getElementById('round-count');
            const playerCount = document.getElementById('player-count');
            
            if (gameState.players.length > 0) {
                const currentPlayer = gameState.players[gameState.currentPlayerIndex];
                currentPlayerDisplay.textContent = `${currentPlayer}'s Turn! 🎯`;
                roundCount.textContent = gameState.round;
                playerCount.textContent = gameState.players.length;
            }
        }
        
        // Event listeners
        document.getElementById('player-name-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addPlayer();
            }
        });
        
        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Truth & Dare with Friends - App Loaded! 🎭');
        });
    </script>
</body>
</html>
